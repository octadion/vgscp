# KILL-SWITCH for Arah 2 — counterfactual support-gap verifiability.
#
# Inherits the premise-2 Waterbirds setup (same f, same per-image CUB attributes, same a-priori
# CLIP scene bank) and adds the dose axis + the lam grid. The mechanism under test: does the DROP
# in verifier support when spurious concepts are removed (the counterfactual support gap) carry
# error information that beats BOTH `trust_concept` AND a clean-support-only control?
#
# This is a go/no-go gate. NO ablations / multi-seed / figures here. STOP after the report.
#
# (config_util expands only the main file's `defaults`, non-recursively, so we re-declare
#  [common, perf] and carry the premise-2 blocks verbatim rather than chaining through
#  premise2_waterbirds.yaml — the settings ARE the premise-2 settings.)
defaults:
  - common
  - perf

dataset:
  name: waterbirds
  root: ${oc.env:WATERBIRDS_ROOT,data/raw/waterbirds}
  download: true
  url: https://nlp.stanford.edu/data/dro/waterbird_complete95_forest2water2.tar.gz
  image_size: 224
  n_classes: 2                  # landbird=0 / waterbird=1
  # group_id = 2*y + place ; place: land=0 / water=1 ; minority/conflict = (y != place)

cub:
  root: ${oc.env:CUB_ROOT,data/raw/cub}
  download: true
  url: https://data.caltech.edu/records/65de6-vp158/files/CUB_200_2011.tgz
  use_certainty: false          # binary is_present (noisy per-image MTurk labels — honest)
  min_coverage: 0.99            # assert >=99% of Waterbirds images match a CUB attribute vector

clip:
  model_name: ViT-B-32
  pretrained: laion2b_s34b_b79k
  temperature_softmax: false
  temperature: 0.01
  # A-PRIORI scene/background prompt bank = the candidate SPURIOUS concepts. The dose axis selects
  # the d concepts with the HIGHEST rho_j (train-only spuriousness) from this fixed bank.
  scene_concept_bank:
    - "a photo taken near water"
    - "an ocean in the background"
    - "a lake in the background"
    - "a river in the background"
    - "a beach"
    - "the open sea"
    - "waves and water"
    - "a forest in the background"
    - "trees in the background"
    - "a bamboo forest"
    - "green grass and foliage"
    - "dry land"
    - "a sky background"
    - "clouds in the sky"
    - "branches of a tree"
    - "reeds and marsh"

# Standardization applied ONCE on TRAIN (z-score, train-only stats), reused by verifier + probes +
# the rho scorer (no leakage).
concepts:
  standardize: true

model:
  backbone: resnet50            # real ERM f; pretrained backbone + SHORT finetune
  pretrained: true
  num_epochs: 5                 # short — the background shortcut is learned fast
  lr: 1.0e-3
  weight_decay: 1.0e-4
  optimizer: adam
  dropout_p: 0.2                # small dropout head -> MC-dropout reuses the same weights

ncv:
  source: reimpl                # faithful PVG over the CONTINUOUS concept vectors
  morgana: on                   # one Arthur per dose (morgana on, so V_comp is also available)
  merlin_sparsity: 6
  morgana_sparsity: 6
  reject_class: true
  hidden: 128
  epochs: 30
  lr: 1.0e-3
  batch_size: 256
  prover_refresh: 1
  morgana_weight: 1.0
  n_train_max: 4000
  standardize: false            # concepts are already TRAIN-standardized upstream

# Ensemble is CONTEXT only here. The run script forces common.ensemble.n_members=3 (the prior
# premise-2 run wrongly used the inherited default 5); kept at 3 here for the same reason.
ensemble:
  n_members: 3
mc_dropout:
  n_passes: 20

probe:
  max_per_split: null
  concept_probe_kind: logistic

# --- KILL-SWITCH axes ---
# dose = number of CLIP spurious scene concepts mixed in (all 312 CUB attrs always present).
dose_grid: [0, 4, 8, 12, 16]
# lam >= 0 trades clean-support against the counterfactual gap in V_gap = support_clean - lam*gap.
lam_grid: [0, 0.5, 1, 2, 4]

experiment:
  name: killswitch_arah2
  seeds: [0]                    # single seed for the gate (reported as single-seed)
  out_dir: results
